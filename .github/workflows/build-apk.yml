name: Build MCApp APK

# Manual trigger: Actions tab → "Build MCApp APK" → Run workflow.
# Produces a signed Android APK that opens the live app (a Trusted Web Activity).
# Install the one APK on every field phone — gives a home-screen icon, no reliance
# on Chrome's "Install" button (which some low-end phones, e.g. Redmi A5, never show).
#
# One-time setup — add these repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your android.keystore (see docs/android-apk.md)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_PASSWORD      key password (often the same)
# The SAME keystore must be reused for every future build, or phones reject the update.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.22.0

      - name: Point Bubblewrap at the runner's JDK + Android SDK (no interactive download)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Bubblewrap validates the SDK by checking for <root>/tools or <root>/bin and looks for
          # sdkmanager there. Modern runners ship the command-line tools at
          # <root>/cmdline-tools/latest/bin, so expose that as <root>/bin for Bubblewrap.
          CLT="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -n "$CLT" ] && [ ! -e "$SDK/bin" ] && [ ! -e "$SDK/tools" ]; then
            ln -s "$CLT" "$SDK/bin" 2>/dev/null || sudo ln -s "$CLT" "$SDK/bin"
          fi
          # Bubblewrap 1.22 needs build-tools 34.0.0 (and the project compiles against android-35).
          # ubuntu-latest ships these; install via the real sdkmanager only if absent.
          if [ ! -d "$SDK/build-tools/34.0.0" ] && [ -n "$CLT" ]; then
            yes | "$CLT/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
            "$CLT/sdkmanager" --sdk_root="$SDK" "build-tools;34.0.0" "platforms;android-35" || true
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"
          echo "JAVA_HOME=$JAVA_HOME"; echo "ANDROID_SDK=$SDK"
          echo "--- SDK root ---"; ls -la "$SDK" | head -30
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        working-directory: android
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Print signing fingerprint (for assetlinks.json)
        working-directory: android
        run: keytool -list -v -keystore android.keystore -alias mcapp -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -A1 "SHA256:" || true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Generate the Android project from twa-manifest.json
        working-directory: android
        # android/ holds only twa-manifest.json; Bubblewrap needs the generated
        # Gradle project + manifest-checksum.txt before it will build without
        # prompting. `update` regenerates both from the manifest (fetches the
        # icon from iconUrl). --skipVersionUpgrade keeps it non-interactive.
        run: bubblewrap update --skipVersionUpgrade < /dev/null

      - name: Build signed APK
        working-directory: android
        run: bubblewrap build --skipPwaValidation < /dev/null
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCApp-signed-apk
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: warn
