<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livelihood Site Visit</title>
<meta name="description" content="Standard one-page report per livelihood project site visit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#EFEEE8; --sheet:#FFFFFF; --ink:#23221F; --muted:#6E6A60; --line:#E6E2D8;
    --forest:#1B5E20; --olive:#6B6B1F; --olive-soft:#F3F2E6;
    --good:#2E7D32; --warn:#B26A00; --bad:#B3261E;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;font-size:15px;padding:24px 14px;}

  /* One sheet = one visit = one printed page */
  .sheet{background:var(--sheet);max-width:820px;margin:0 auto 26px;border:1px solid var(--line);
    border-radius:10px;padding:34px 38px 26px;box-shadow:0 2px 10px rgba(0,0,0,.05);}

  .mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    border-bottom:3px solid var(--forest);padding-bottom:12px;}
  .eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700;}
  h1{font-family:var(--serif);font-weight:600;font-size:1.72rem;line-height:1.1;margin:.18em 0 0;text-wrap:balance;}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    background:var(--olive-soft);border:1px solid #D8D6C4;color:var(--olive);border-radius:999px;padding:4px 11px;white-space:nowrap;}

  .facts{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:.84rem;color:var(--muted);margin:14px 0 18px;}
  .facts b{color:var(--ink);font-weight:600;}

  .section-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);
    font-weight:700;margin:0 0 8px;}

  .fields{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .f{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid var(--line);}
  .f:last-child{border-bottom:none;}
  .f .k{background:#FAFAF6;padding:11px 14px;font-size:.76rem;font-weight:600;color:var(--muted);
    letter-spacing:.02em;text-transform:uppercase;border-right:1px solid var(--line);}
  .f .v{padding:11px 15px;font-size:.95rem;}
  .f .v.empty{color:#B6B2A6;font-style:italic;}

  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .ph{width:150px;}
  .ph .box{height:104px;border:1px dashed #CFC9B6;border-radius:8px;background:
    repeating-linear-gradient(45deg,#FBFAF2,#FBFAF2 7px,#F4F2E6 7px,#F4F2E6 14px);
    display:flex;align-items:center;justify-content:center;color:#A79F86;font-size:.74rem;}
  .ph .cap{font-size:.64rem;color:var(--muted);margin-top:4px;word-break:break-all;line-height:1.3;}

  .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;
    margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);}
  .loc.ok{color:var(--good);} .loc.miss{color:var(--warn);font-weight:600;}
  .flags{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 9px;}
  .chip.warn{background:#FBF0DD;color:var(--warn);}
  .chip.bad{background:#FBE3E1;color:var(--bad);}
  .gen{font-size:.72rem;color:#9A968B;text-align:right;margin-top:10px;}

  @media print{
    @page{ margin:14mm; }
    body{background:#fff;padding:0;font-size:12px;}
    .sheet{max-width:none;margin:0;border:none;border-radius:0;box-shadow:none;padding:0;
      break-after:page;page-break-after:always;}
    .sheet:last-child{break-after:auto;page-break-after:auto;}
    .ph .box{background:#f3f2e6;}
  }
</style>
</head>
<body>
<div id="report"></div>

<script>
/* ---- Livelihood records (sample = real site visits by Solomon Kotumba).
   One sheet / one printed page is produced per record. Replace or inject
   this array to render any set of visits. ---- */
const RECORDS = /*__LVH__*/ [
  { site:"Piggery — Zone 7B", type:"Piggery", zone:"Z07B", clan:"",
    officer:"Solomon Kotumba", officer_id:"CIFOR-ICRAF -ST",
    recorded_at:"2026-11-08T23:41:11.962Z",
    structure_status:"Project hire transport quotation",
    signs_of_use:"", survival:"", stories:"", issues:"",
    inputs_needed:"Current issues need 3 other alternatives for convenience",
    photos:["CIFORICRAFST-LVH-20261109T0941-494J_0.jpg"],
    gps:{lat:"-9.13891",lng:"148.38747",accuracy:20,source:"gps"} },

  { site:"Piggery — Zone 5", type:"Piggery", zone:"Z05", clan:"",
    officer:"Solomon Kotumba", officer_id:"CIFOR-ICRAF -ST",
    recorded_at:"2026-11-07T04:48:23.512Z",
    structure_status:"Proposed piggery project site",
    signs_of_use:"", survival:"", stories:"", issues:"No issues",
    inputs_needed:"Transport sand gravel",
    photos:["CIFORICRAFST-LVH-20261107T1448-458J_0.jpg"],
    gps:null },

  { site:"Vegetable farm — Zone 5", type:"Vegetable farm", zone:"Z05", clan:"",
    officer:"Solomon Kotumba", officer_id:"CIFOR-ICRAF -ST",
    recorded_at:"2026-11-07T04:44:47.729Z",
    structure_status:"Project site piggery",
    signs_of_use:"", survival:"", stories:"", issues:"No commitment",
    inputs_needed:"More sand and stones",
    photos:["CIFORICRAFST-LVH-20261107T1444-6ME6_0.jpg","CIFORICRAFST-LVH-20261107T1444-6ME6_1.jpg"],
    gps:{lat:"-9.06279",lng:"148.31976",accuracy:6,source:"gps"} },

  { site:"Piggery — Zone 5", type:"Piggery", zone:"Z05", clan:"",
    officer:"Solomon Kotumba", officer_id:"CIFOR-ICRAF -ST",
    recorded_at:"2026-11-06T09:45:53.195Z",
    structure_status:"Proposed piggery project site",
    signs_of_use:"Initial sand and gravel /stones still the same", survival:"", stories:"",
    issues:"", inputs_needed:"Needs commitment to progressive results",
    photos:[], gps:null },
];

/* Photo images keyed by media filename. Empty here (a repo-light template);
   a backend-served or exported copy injects resolved thumbnails/data-URIs so
   the real photos show instead of filename placeholders. */
const PHOTOS = /*__PHOTOS__*/ {};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function png(iso){
  if(!iso) return "—";
  const d=new Date(new Date(iso).getTime()+10*3600*1000);
  let h=d.getUTCHours(), ap=h<12?'am':'pm', h12=h%12||12;
  return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear()+', '+h12+':'+String(d.getUTCMinutes()).padStart(2,'0')+' '+ap+' PNG';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const FIELDS=[
  ['Structure & status','structure_status'],
  ['Signs of use','signs_of_use'],
  ['Condition / survival','survival'],
  ['Field notes','stories'],
  ['Issues arising','issues'],
  ['Inputs needed','inputs_needed'],
];
const GEN = png(new Date().toISOString());

document.getElementById('report').innerHTML = RECORDS.map(r=>{
  const rows = FIELDS.map(([label,key])=>{
    const v=(r[key]||'').trim();
    return '<div class="f"><div class="k">'+label+'</div><div class="v'+(v?'':' empty')+'">'+(v?esc(v):'— not recorded')+'</div></div>';
  }).join('');
  const photos = (r.photos&&r.photos.length)
    ? '<div class="section-label" style="margin-top:20px;">Photos</div><div class="photos">'+
      r.photos.map(p=>'<div class="ph">'+(PHOTOS[p]?('<img src="'+PHOTOS[p]+'" alt="'+esc(p)+'" style="width:100%;height:104px;object-fit:cover;display:block;border-radius:8px;">'):'<div class="box">photo</div>')+'<div class="cap">'+esc(p)+'</div></div>').join('')+'</div>'
    : '';
  const loc = r.gps
    ? '<span class="loc ok">◎ '+esc(r.gps.lat)+', '+esc(r.gps.lng)+' · ±'+esc(r.gps.accuracy)+' m'+(r.gps.source==='coarse'?' (approx)':'')+'</span>'
    : '<span class="loc miss">◎ No GPS fix — flagged for review</span>';
  const flags=[];
  if(!r.gps) flags.push('<span class="chip warn">location missing</span>');
  if(r.type==='Vegetable farm' && /piggery/i.test(r.structure_status||'')) flags.push('<span class="chip bad">type/status mismatch</span>');
  const flagsHtml = flags.length?'<div class="flags">'+flags.join('')+'</div>':'<span></span>';
  return ''+
  '<section class="sheet">'+
    '<div class="mast"><div>'+
      '<div class="eyebrow">Managalas Conservation Area · Livelihood Site Visit</div>'+
      '<h1>'+esc(r.site)+'</h1></div>'+
      '<span class="pill">'+esc(r.type)+'</span></div>'+
    '<div class="facts">'+
      '<span>Zone <b>'+esc(r.zone||'—')+'</b></span>'+
      '<span>Clan <b>'+esc(r.clan||'—')+'</b></span>'+
      '<span>Visited <b>'+png(r.recorded_at)+'</b></span>'+
      '<span>Officer <b>'+esc(r.officer)+'</b> · '+esc(r.officer_id)+'</span>'+
    '</div>'+
    '<div class="section-label">Observations</div>'+
    '<div class="fields">'+rows+'</div>'+
    photos+
    '<div class="foot">'+loc+flagsHtml+'</div>'+
    '<div class="gen">Managalas Conservation Area · CIFOR-ICRAF · generated '+GEN+' · times in PNG (UTC+10) · photos on Drive</div>'+
  '</section>';
}).join('');
</script>
</body>
</html>
