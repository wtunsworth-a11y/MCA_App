<!doctype html>
<!--
  MCApp — Value Chain Audit: Training Needs report (TEMPLATE, data-driven)

  HOW IT IS FED
  -------------
  The page renders entirely from one array, AUDITS, in the shape the phones
  upload (modules.vc_audit records). To produce a real report, replace the
  `/*__AUDITS__*/ []` placeholder below with the audit records for the period.
  Each record needs: commodity, commodity_name, commodity_draft, module_code,
  module_name, assessor_id/name, assessor_zone_id/zone, recorded_at,
  responses[{code,item,critical,weight,response,value}], and
  photos[{stage,stage_name,item_code,practice:'good'|'bad',caption,
          thumb_url,original_url}].

  PHOTOS / LINKING TO ORIGINALS
  -----------------------------
  The report never re-stores images. For each audit photo the backend resolves
  the record's {_media:"<filename>"} reference to the file in the steward's
  Drive media/ folder and sets:
    original_url = that file's Drive link (webViewLink)   -> opened on click
    thumb_url    = Drive thumbnail link, e.g. .../thumbnail?id=<ID>&sz=w320
  (In this demo thumb_url is omitted and a placeholder tile is drawn instead.)

  The analysis (per-item shortfall ranking, per-stage means, per-commodity
  rollups) is computed in-page and mirrors the backend vcTrainingNeedsReport().
-->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value Chain Training Needs</title>
<meta name="description" content="Training-needs analysis built from MCApp value-chain audits — ranked by where practice is weakest, with good/bad practice photos linked to their originals.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

    --ink:#e7ece7; --muted:#a3ada5; --faint:#7a847b;
    --rule:#2b332d; --rule-bold:#3b443d;
    --forest:#6bbf72; --forest-ink:#8fd196; --forest-soft:#1b2a1e;
    --good:#67b56d; --good-soft:#1b2a1e;
    --bad:#e78a52; --bad-soft:#2f2016; --bad-ink:#f0a176;
    --warn:#e0a35c; --warn-soft:#2d2114;
    --c-van:#6bbf72; --c-cof:#ca9a5e; --c-coc:#b89ae0;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1310; --page:#161b17; --panel:#1e241f; --panel2:#232a24;
    --ink:#e7ece7; --muted:#a3ada5; --faint:#7a847b;
    --rule:#2b332d; --rule-bold:#3b443d;
    --forest:#6bbf72; --forest-ink:#8fd196; --forest-soft:#1b2a1e;

  .shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--panel2)}

  .shot .pr.good{background:var(--good-soft);color:var(--good)}
  .shot .pr.bad{background:var(--bad-soft);color:var(--bad-ink)}
  .shot .ct{font-size:.78rem;margin:5px 0 2px;line-height:1.25}
  .shot .mt{font-size:.68rem;color:var(--faint);font-family:var(--mono);display:flex;justify-content:space-between;gap:6px;align-items:center}
  .shot .open{color:var(--forest)}

  .foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  @page{size:A4;margin:14mm}
  .toolbar{max-width:1000px;margin:14px auto -8px;display:flex;justify-content:flex-end;gap:8px;padding:0 10px}
  .toolbar button{font-family:var(--sans);font-size:.78rem;border:1px solid var(--rule-bold);background:var(--page);color:var(--muted);border-radius:7px;padding:6px 12px;cursor:pointer}

<body>
<div class="toolbar"><button onclick="window.print()">Print / Save PDF</button></div>
<div class="page" id="page"></div>

<script>
const AUDITS = /*__AUDITS__*/ [];

/* ---- helpers ---- */
const COM_ORDER = ['vanilla','coffee','cocoa'];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pngDate = iso => { const d=new Date(iso); return isNaN(d)?'':new Date(d.getTime()+10*3600000).toISOString().slice(0,10); };
const fmtDate = ymd => { if(!ymd) return ''; const [y,m,dd]=ymd.split('-'); return dd+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y; };
function scoreColor(v){ /* v 0..1 */ return v>=0.75?'var(--good)':v>=0.5?'var(--warn)':'var(--bad)'; }

/* ---- analysis (same inputs the phones upload) ---- */
function analyze(audits){
  const byCom={};
  let minD=null,maxD=null; const allAuditors=new Set(); let photoN=0;
  for(const a of audits){
    const d=pngDate(a.recorded_at); if(d){ if(!minD||d<minD)minD=d; if(!maxD||d>maxD)maxD=d; }
    allAuditors.add(a.assessor_id);
    const C = byCom[a.commodity] || (byCom[a.commodity]={key:a.commodity,name:a.commodity_name,draft:!!a.commodity_draft,visits:0,items:{},stages:{},photos:[],auditors:new Set(),zones:new Set()});
    C.visits++; C.auditors.add(a.assessor_id); if(a.assessor_zone_id) C.zones.add(a.assessor_zone_id);
    const st=C.stages[a.module_code]||(C.stages[a.module_code]={code:a.module_code,name:a.module_name,n:0,sum:0,critFail:0,visits:0});
    st.visits++;
    for(const r of (a.responses||[])){
      if(r.value==null) continue;
      const sc=r.value/2;
      const it=C.items[r.code]||(C.items[r.code]={code:r.code,item:r.item,stage:a.module_code,stage_name:a.module_name,critical:!!r.critical,n:0,sum:0,yes:0,partial:0,no:0});
      it.n++; it.sum+=sc; it[r.response]=(it[r.response]||0)+1;
      st.n++; st.sum+=sc; if(r.critical&&r.response==='no') st.critFail++;
    }
    for(const p of (a.photos||[])){ photoN++; C.photos.push(Object.assign({},p,{assessor:a.assessor_name,date:pngDate(a.recorded_at),farmer_village:a.farmer_village})); }
  }
  for(const k in byCom){ const C=byCom[k];
    C.itemList=Object.values(C.items).map(it=>{it.mean=it.n?it.sum/it.n:0; it.shortfall=1-it.mean; return it;})
      .sort((a,b)=> (b.shortfall-a.shortfall) || (b.n-a.n));
    C.stageList=Object.values(C.stages).map(s=>{s.mean=s.n?s.sum/s.n:0; return s;})
      .sort((a,b)=> a.code.localeCompare(b.code,undefined,{numeric:true}));
    C.mean = C.itemList.length? C.itemList.reduce((x,it)=>x+it.mean,0)/C.itemList.length : 0;
  }
  return {byCom, minD, maxD, auditors:allAuditors.size, photoN, total:audits.length};
}

/* ---- placeholder thumbnail (stands in for the real Drive photo in this demo) ---- */
function thumb(practice, stageName, caption){
  const c=document.createElement('canvas'); c.width=320; c.height=240; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,240);
  if(practice==='good'){ g.addColorStop(0,'#3f7d44'); g.addColorStop(1,'#1f4a26'); }
  else { g.addColorStop(0,'#b4551f'); g.addColorStop(1,'#7a3410'); }
  x.fillStyle=g; x.fillRect(0,0,320,240);
  x.globalAlpha=.16; x.fillStyle='#fff';
  for(let i=0;i<40;i++){ x.beginPath(); x.arc(Math.random()*320,Math.random()*240,4+Math.random()*26,0,7); x.fill(); }
  x.globalAlpha=1;
  x.fillStyle='rgba(0,0,0,.28)'; x.fillRect(0,168,320,72);
  x.fillStyle='#fff'; x.font='600 15px "IBM Plex Sans",sans-serif';
  x.fillText(stageName.length>34?stageName.slice(0,33)+'…':stageName, 14, 192);
  x.font='400 12px "IBM Plex Sans",sans-serif'; x.fillStyle='rgba(255,255,255,.85)';
  x.fillText(caption.length>40?caption.slice(0,39)+'…':caption, 14, 212);
  x.font='italic 10px "IBM Plex Sans",sans-serif'; x.fillStyle='rgba(255,255,255,.6)';
  x.fillText('sample image — real capture on Drive', 14, 230);
  return c.toDataURL('image/jpeg',0.72);
}

/* ---- render ---- */
/* ---- date filtering (all data is in the page, so filtering is instant) ---- */
const STATE={from:'',to:'',preset:'all'};
const auditDate=a=>pngDate(a.recorded_at);
const DATES=AUDITS.map(auditDate).filter(Boolean).sort();
const MIN_D=DATES[0]||'', MAX_D=DATES[DATES.length-1]||'';
function inRange(a){ const d=auditDate(a); if(!d) return false; if(STATE.from&&d<STATE.from) return false; if(STATE.to&&d>STATE.to) return false; return true; }
function currentAudits(){ return AUDITS.filter(inRange); }
function setPreset(p){
  STATE.preset=p; STATE.to='';
  if(p==='all'){ STATE.from=''; }
  else if(p==='ytd'){ STATE.from=(MAX_D||'').slice(0,4)+'-01-01'; }
  else { const m={'3m':3,'6m':6,'12m':12}[p]||3; const d=new Date((MAX_D||new Date().toISOString().slice(0,10))+'T00:00:00'); d.setMonth(d.getMonth()-m); STATE.from=d.toISOString().slice(0,10); }
  render();
}
function setRange(){ const f=document.getElementById('fromD'), t=document.getElementById('toD'); STATE.from=f?f.value:''; STATE.to=t?t.value:''; STATE.preset='custom'; render(); }

/* ---- change over time: monthly mean score per commodity ---- */
const COM_COLOR={vanilla:'var(--c-van)',coffee:'var(--c-cof)',cocoa:'var(--c-coc)'};
function ym(d){ return d.slice(0,7); }
function monthlySeries(audits){
  const by={}, monthsSet=new Set(), names={};
  for(const a of audits){ const k=ym(auditDate(a)); if(!k) continue; monthsSet.add(k); names[a.commodity]=a.commodity_name;
    const cm=by[a.commodity]||(by[a.commodity]={}); const s=cm[k]||(cm[k]={sum:0,n:0});
    for(const r of (a.responses||[])){ if(r.value==null) continue; s.sum+=r.value/2; s.n++; } }
  const months=[...monthsSet].sort();
  const series=COM_ORDER.filter(k=>by[k]).map(k=>({key:k,name:names[k]||k,
    points:months.map(m=>({ym:m,mean:(by[k][m]&&by[k][m].n)?by[k][m].sum/by[k][m].n:null,n:by[k][m]?by[k][m].n:0}))}));
  return {months,series};
}
function trendSVG(audits){
  const {months,series}=monthlySeries(audits);
  if(months.length<2) return `<div class="note" style="border-left-color:var(--rule-bold)">Not enough months in this range yet to show a trend — the line builds as visits accumulate across months.</div>`;
  const W=760,H=300,L=38,R=14,T=16,B=46, iw=W-L-R, ih=H-T-B;
  const x=i=> L + (months.length===1?iw/2:iw*i/(months.length-1));
  const y=v=> T + ih*(1-v);
  let g='';
  [0,.25,.5,.75,1].forEach(v=>{ g+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--mono)">${Math.round(v*100)}</text>`; });
  const step=Math.max(1,Math.ceil(months.length/8));
  months.forEach((m,i)=>{ if(i%step===0||i===months.length-1){ const [yy,mm]=m.split('-'); g+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--mono)">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mm-1]}<tspan fill="var(--faint)"> '${yy.slice(2)}</tspan></text>`; } });
  series.forEach(s=>{
    const col=COM_COLOR[s.key]||'var(--forest)'; let d='',started=false;
    s.points.forEach((p,i)=>{ if(p.mean==null){ started=false; return; } d+=(started?'L':'M')+x(i)+' '+y(p.mean)+' '; started=true; });
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.points.forEach((p,i)=>{ if(p.mean==null) return; g+=`<circle cx="${x(i)}" cy="${y(p.mean)}" r="${p.n>=3?3.6:2.6}" fill="${col}"/>`; });
  });
  const legend=series.map(s=>`<span class="lg"><span class="dot" style="background:${COM_COLOR[s.key]}"></span>${esc(s.name)}</span>`).join('');
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Monthly mean score by commodity">${g}</svg></div><div class="legend">${legend}<span class="lg-note">mean item score (%) per month · larger dots = more observations</span></div>`;
}
/* ---- cross-chain themes: group every item into a shared theme so a weakness
   common to all crops stands apart from a crop-specific one. Hygiene and sales
   are cross-cutting (they live inside several stages), so they are matched on
   the item text first; everything else falls to its process stage. ---- */
const THEME_ORDER=['Agronomy & field','Harvest','Processing & drying','Hygiene & contamination','Quality & grading','Storage','Sales & market','Other'];
function themeOf(item, stage){
  const it=(item||'').toLowerCase(), st=(stage||'').toLowerCase();
  if(/smoke|contaminat|mould|mold|pest|sour smell|odour|odor/.test(it)) return 'Hygiene & contamination';
  if(/nursery|planting|young|mature|vine plot|pollinat/.test(st)) return 'Agronomy & field';
  if(/harvest|pods on the vine|pod break/.test(st)) return 'Harvest';
  if(/killing|sweating|ferment|wash|pulp|dry/.test(st)) return 'Processing & drying';
  if(/quality/.test(st)) return 'Quality & grading';
  if(/conditioning|storage/.test(st)) return 'Storage';
  if(/\bsale\b/.test(st)) return 'Sales & market';
  return 'Other';
}
function crossThemes(audits){
  const T={};
  for(const a of audits){ for(const r of (a.responses||[])){ if(r.value==null) continue;
    const th=themeOf(r.item, a.module_name), sc=r.value/2;
    const t=T[th]||(T[th]={theme:th,n:0,sum:0,com:{}});
    t.n++; t.sum+=sc;
    const c=t.com[a.commodity]||(t.com[a.commodity]={n:0,sum:0,name:a.commodity_name});
    c.n++; c.sum+=sc;
  }}
  return Object.values(T).map(t=>{t.mean=t.n?t.sum/t.n:0; t.shortfall=1-t.mean; t.spread=0;
    const ms=COM_ORDER.filter(k=>t.com[k]).map(k=>t.com[k].sum/t.com[k].n); if(ms.length>1){ t.spread=Math.max(...ms)-Math.min(...ms); }
    return t;}).sort((a,b)=> b.shortfall-a.shortfall);
}
function itemTrends(audits){
  const ds=audits.map(auditDate).filter(Boolean).sort(); if(ds.length<4) return {};
  const mid=ds[Math.floor(ds.length/2)]; const agg={};
  for(const a of audits){ const half=auditDate(a)<mid?'e':'l'; const cm=agg[a.commodity]||(agg[a.commodity]={});
    for(const r of (a.responses||[])){ if(r.value==null) continue; const it=cm[r.code]||(cm[r.code]={e:[0,0],l:[0,0]}); it[half][0]+=r.value/2; it[half][1]++; } }
  const out={};
  for(const com in agg){ out[com]={}; for(const code in agg[com]){ const o=agg[com][code];
    if(o.e[1]>=2&&o.l[1]>=2){ const diff=(o.l[0]/o.l[1])-(o.e[0]/o.e[1]); out[com][code]= diff>0.08?'up':diff<-0.08?'down':'flat'; } } }
  return out;
}
function trendArrow(dir){
  if(dir==='up') return '<span class="tr up" title="improving vs earlier in range">▲</span>';
  if(dir==='down') return '<span class="tr down" title="worsening vs earlier in range">▼</span>';
  if(dir==='flat') return '<span class="tr flat" title="little change">→</span>';
  return '<span class="tr none" title="not enough data to compare">·</span>';
}

function render(){
  const audits=currentAudits();
  const A=analyze(audits); const P=document.getElementById('page'); let H='';
  const trends=itemTrends(audits);
  const stagesCovered=Object.values(A.byCom).reduce((n,C)=>n+C.stageList.length,0);
  H+=`<div class="mast">
    <p class="eyebrow">Managalas Conservation Area · MCApp · Value Chains</p>
    <h1>Value Chain Audit — Training Needs</h1>
    <div class="sub">Where practice is weakest across the vanilla, coffee and cocoa value chains — so training goes where it is needed most.</div>
    <div class="meta"><span>Showing <b>${fmtDate(A.minD)||'—'} – ${fmtDate(A.maxD)||'—'}</b> (PNG)</span><span><b>${A.total}</b> audit visits</span><span>Generated <b>${fmtDate(pngDate(new Date().toISOString()))}</b></span></div>
  </div>`;
  const pre=(p,lbl)=>`<button class="${STATE.preset===p?'on':''}" onclick="setPreset('${p}')">${lbl}</button>`;
  H+=`<div class="controls">
    <div class="presets">${pre('all','All')}${pre('12m','Last 12 mo')}${pre('6m','Last 6 mo')}${pre('3m','Last 3 mo')}${pre('ytd','This year')}</div>
    <div class="range">
      <label>From <input type="date" id="fromD" value="${STATE.from}" min="${MIN_D}" max="${MAX_D}" onchange="setRange()"></label>
      <label>To <input type="date" id="toD" value="${STATE.to}" min="${MIN_D}" max="${MAX_D}" onchange="setRange()"></label>
    </div>
  </div>`;
  if(A.total===0){ P.innerHTML=H+`<div class="note" style="border-left-color:var(--bad)">No audits in this date range.</div>`; return; }
  H+=`<div class="kpis">
    <div class="kpi"><div class="v">${A.total}</div><div class="l">Audit visits</div></div>
    <div class="kpi"><div class="v">${Object.keys(A.byCom).length}</div><div class="l">Value chains</div></div>
    <div class="kpi"><div class="v">${stagesCovered}</div><div class="l">Stages with data</div></div>
    <div class="kpi"><div class="v">${A.auditors}</div><div class="l">Auditors</div></div>
    <div class="kpi"><div class="v">${A.photoN}</div><div class="l">Practice photos</div></div>
  </div>`;
  H+=`<h2>Change over time</h2>`;
  H+=`<div class="cmeta" style="margin-bottom:8px">Overall practice score by month, per value chain — the signal for whether training is moving the needle. Use the date filter above to focus a period.</div>`;
  H+=trendSVG(audits);
  H+=`<div class="note">One visit scores one stage, so the picture builds up over seasons. Each item is scored on the same basis (Yes 100% · Partial 50% · No 0%, the critical double-weight set aside so items compare), then ranked by <b>shortfall</b> — the gap to full marks. The <b>trend arrow</b> compares the later half of the selected range with the earlier half.</div>`;

  /* cross-chain: common weaknesses by theme */
  const themes=crossThemes(audits);
  if(themes.length){
    H+=`<h2>Common weaknesses — all value chains</h2>`;
    H+=`<div class="cmeta" style="margin-bottom:8px">The same practices grouped across vanilla, coffee and cocoa, so a weakness shared by every crop (train it once, help three chains) stands apart from a crop-specific one. Ranked by shortfall; the by-crop figures show whether it is shared or concentrated.</div>`;
    H+=`<table class="theme"><thead><tr><th>Theme</th><th class="n">Obs</th><th>All crops</th><th>By crop</th></tr></thead><tbody>`;
    themes.filter(t=>t.theme!=='Other').forEach(t=>{
      const mp=Math.round(t.mean*100);
      const per=COM_ORDER.filter(k=>t.com[k]).map(k=>{const c=t.com[k],m=c.sum/c.n;
        return `<span class="cc"><i class="ccd" style="background:${COM_COLOR[k]}"></i>${esc(c.name)} <b style="color:${scoreColor(m)}">${Math.round(m*100)}%</b></span>`;}).join('');
      const shared = (t.spread>0 && t.spread<0.15 && COM_ORDER.filter(k=>t.com[k]).length>=2) ? '<span class="shared" title="similar across crops — a shared weakness">shared</span>' : '';
      H+=`<tr>
        <td><b>${esc(t.theme)}</b> ${shared}</td>
        <td class="n">${t.n}</td>
        <td><div class="sf"><div class="sf-bar"><div class="sf-fill" style="width:${mp}%;background:${scoreColor(t.mean)}"></div></div><span class="sf-v">${mp}%</span></div></td>
        <td class="cc-wrap">${per}</td>
      </tr>`;
    });
    H+=`</tbody></table>`;
  }

  COM_ORDER.filter(k=>A.byCom[k]).forEach(k=>{
    const C=A.byCom[k];
    H+=`<h2>${esc(C.name)} ${C.draft?'<span class="draft">draft checklist</span>':''}</h2>`;
    H+=`<div class="cmeta"><span class="chip">${C.visits} visits</span><span class="chip">overall ${Math.round(C.mean*100)}%</span><span class="chip">${C.auditors.size} auditor${C.auditors.size!==1?'s':''}</span><span class="chip">${C.zones.size} zone${C.zones.size!==1?'s':''}</span></div>`;

    H+=`<h3>Top training priorities</h3>`;
    H+=`<table><thead><tr><th class="n">#</th><th>Practice</th><th>Stage</th><th class="n">Obs</th><th>Y / P / N</th><th>Shortfall</th><th class="tc">Trend</th></tr></thead><tbody>`;
    const ctr=trends[k]||{};
    C.itemList.slice(0,12).forEach((it,i)=>{
      const sfPct=Math.round(it.shortfall*100);
      H+=`<tr>
        <td class="n rank">${i+1}</td>
        <td>${esc(it.item)}${it.critical?'<span class="crit">critical</span>':''}<div style="font-size:.66rem;color:var(--faint);font-family:var(--mono)">${esc(it.code)}</div></td>
        <td style="font-size:.78rem;color:var(--muted)">${esc(it.stage)} · ${esc(it.stage_name)}</td>
        <td class="n">${it.n}</td>
        <td class="ypn"><span class="y">${it.yes||0}</span> / <span class="p">${it.partial||0}</span> / <span class="no">${it.no||0}</span></td>
        <td><div class="sf"><div class="sf-bar"><div class="sf-fill" style="width:${sfPct}%;background:${scoreColor(it.mean)}"></div></div><span class="sf-v">${sfPct}%</span></div></td>
        <td class="tc">${trendArrow(ctr[it.code])}</td>
      </tr>`;
    });
    H+=`</tbody></table>`;

    H+=`<h3>By stage</h3><div class="stages">`;
    C.stageList.forEach(s=>{
      H+=`<div class="st"><div class="sc" style="color:${scoreColor(s.mean)}">${s.n?Math.round(s.mean*100)+'%':'—'}</div>
        <div class="nm"><b>${esc(s.code)}</b> ${esc(s.name)}</div>
        <div class="ex">${s.visits} visit${s.visits!==1?'s':''}${s.critFail?' · '+s.critFail+' critical No':''}</div></div>`;
    });
    H+=`</div>`;
  });

  /* practice gallery */
  const allPhotos=[]; COM_ORDER.filter(k=>A.byCom[k]).forEach(k=>A.byCom[k].photos.forEach(p=>allPhotos.push(Object.assign({commodity:A.byCom[k].name},p))));
  const good=allPhotos.filter(p=>p.practice==='good').length, bad=allPhotos.filter(p=>p.practice==='bad').length;
  H+=`<h2>Good &amp; bad practice — photo library</h2>`;
  H+=`<div class="note">Photos the auditors flagged, tagged by stage and as good or bad practice — ready to reuse as training material. The report keeps a light thumbnail and <b>links each one to the full-resolution original on Drive</b> (click any photo); nothing is re-stored here. <b>${good} good</b> · <b>${bad} bad</b>.</div>`;
  H+=`<div class="seg" id="galSeg">
     <button class="on" data-f="all" onclick="galFilter('all',this)">All (${allPhotos.length})</button>
     <button data-f="good" onclick="galFilter('good',this)">Good (${good})</button>
     <button data-f="bad" onclick="galFilter('bad',this)">Bad (${bad})</button></div>`;
  H+=`<div class="gallery" id="gallery"></div>`;

  P.innerHTML=H;
  window.__photos=allPhotos; galFilter('all');
}

function galFilter(f, btn){
  if(btn){ document.querySelectorAll('#galSeg button').forEach(b=>b.classList.toggle('on',b===btn)); }
  const list=(window.__photos||[]).filter(p=> f==='all'||p.practice===f);
  document.getElementById('gallery').innerHTML = list.map(p=>{
    const t = p.thumb_url || thumb(p.practice, p.stage_name||p.stage||'', p.caption||'');
    return `<a class="shot" href="${esc(p.original_url||'#')}" target="_blank" rel="noopener">
      <img src="${t}" alt="${esc(p.caption||'')}" loading="lazy">
      <div class="cap">
        <span class="pr ${p.practice}">${p.practice} practice</span>
        <div class="ct">${esc(p.caption||'')}</div>
        <div class="mt"><span>${esc(p.commodity||'')} · ${esc(p.stage||'')}</span><span class="open">↗ original</span></div>
      </div></a>`;
  }).join('');
}
render();
</script>
</body>
</html>
